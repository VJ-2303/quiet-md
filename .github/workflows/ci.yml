name: CI

on:
  push:
    branches: [main, linux]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-build:
    name: Linux x64 build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libfontconfig1-dev libfreetype6-dev libwayland-dev libx11-xcb-dev libvulkan-dev

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true

      - name: Build application
        run: cargo build --release --locked

      - name: Package binary
        run: |
          mkdir -p dist
          tar -czvf dist/quiet-md-linux-x64.tar.gz -C target/release quiet_md

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: quiet-md-linux-x64
          path: dist/quiet-md-linux-x64.tar.gz
